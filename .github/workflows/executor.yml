name: Parallel Simulations

# Set concurrency group to allow multiple workflows but limit per-workflow concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      N:
        description: Number of qubits
        default: '14'
        required: true
      T:
        description: Time to run
        default: '1000'
        required: true
      circuit_realizations:
        description: Total circuit realizations
        default: '10'
        required: true
      L:
        description: Grid resolution
        default: '3'
        required: true
      batch_size:
        description: Number of points per job
        default: '50'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.make-matrix.outputs.matrix }}
    steps:
      - name: Calculate batch matrix
        id: make-matrix
        run: |
          N=${{ github.event.inputs.N }}
          CR=${{ github.event.inputs.circuit_realizations }}
          L=${{ github.event.inputs.L }}
          b=${{ github.event.inputs.batch_size }}
          
          pts=()
          for cr in $(seq 0 $((CR-1))); do
            for ix in $(seq 0 $((L-1))); do
              for iz in $(seq 0 $((L-1))); do
                pts+=( "{\"cr\":$cr,\"ix\":$ix,\"iz\":$iz}" )
              done
            done
          done
          
          total=${#pts[@]}
          M=$(( (total + b - 1) / b ))
          
          matrix="["
          for i in $(seq 0 $((M-1))); do
            start=$(( i * b ))
            end=$(( start + b - 1 ))
            if [ $end -ge $((total-1)) ]; then end=$((total-1)); fi
            
            batch_pts="["
            for j in $(seq $start $end); do
              batch_pts+="${pts[j]}"
              if [ $j -lt $end ]; then batch_pts+=','; fi
            done
            batch_pts+="]"
            
            matrix+="{\"batch_index\":$i,\"points\":$batch_pts}"
            if [ $i -lt $((M-1)) ]; then matrix+=','; fi
          done
          matrix+="]"
          
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  run-batch:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
      # Don't cancel all jobs if one fails
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'python_statevector_simulation/requirements.txt'

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python3 -m pip install --upgrade pip
          pip install -r python_statevector_simulation/requirements.txt

      - name: Debug batch info
        run: |
          echo "Batch index: ${{ matrix.batch_index }}"
          echo "Points JSON: ${{ matrix.points }}"
          echo "Total points in batch: $(echo '${{ matrix.points }}' | jq '. | length')"
          
          # Debug individual points extraction
          echo "Individual points:"
          for p in $(echo '${{ matrix.points }}' | jq -c '.[]'); do
            cr=$(echo $p | jq '.cr')
            ix=$(echo $p | jq '.ix')
            iz=$(echo $p | jq '.iz')
            echo "  Point: cr=$cr ix=$ix iz=$iz"
          done

      - name: Run simulation
        working-directory: python_statevector_simulation
        run: |
          POINT_FLAGS=""
          for p in $(echo '${{ matrix.points }}' | jq -c '.[]'); do
            cr=$(echo $p | jq '.cr')
            ix=$(echo $p | jq '.ix')
            iz=$(echo $p | jq '.iz')
            POINT_FLAGS+=" --point $cr $ix $iz"
          done

          python single_run.py \
            --N ${{ github.event.inputs.N }} \
            --T ${{ github.event.inputs.T }} \
            --circuit-realizations ${{ github.event.inputs.circuit_realizations }} \
            --L ${{ github.event.inputs.L }} \
            --params-path ../random_archive/angles_N${{ github.event.inputs.N }}.json \
            --output-magic results/magic/N${{ github.event.inputs.N }}/T${{ github.event.inputs.T }} \
            --output-entanglement results/entanglement/N${{ github.event.inputs.N }}/T${{ github.event.inputs.T }} \
            $POINT_FLAGS

      - name: Upload batch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: results-batch-${{ matrix.batch_index }}
          path: python_statevector_simulation/results/
          retention-days: 5  # Keep artifacts for 5 days to save storage
          
  combine-results:
    needs: run-batch
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'python_statevector_simulation/requirements.txt'
          
      - name: Install prerequisites
        run: |
          pip install -r python_statevector_simulation/requirements.txt
          
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: results-batch-*
          merge-multiple: true
          
      - name: Combine results
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_NAME=${REPO_NAME#*/}  # Remove owner/ prefix
          python python_statevector_simulation/fetch.py \
            --owner ${{ github.repository_owner }} \
            --repo ${REPO_NAME} \
            --workflow executor.yml \
            --hours 1 \
            --outdir combined_results \
            --token ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: combined-results-N${{ github.event.inputs.N }}-T${{ github.event.inputs.T }}-L${{ github.event.inputs.L }}
          path: combined_results/
          retention-days: 30  # Keep combined results longer
